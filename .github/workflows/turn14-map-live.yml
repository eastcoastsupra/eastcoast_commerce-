name: Turn 14 Chemical Guys Live MAP Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/turn14-map-live.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: Site to update
        required: true
        default: all
        type: choice
        options:
          - all
          - eastcoastsupra
          - ecbmw
      max_updates:
        description: Maximum price increases per site
        required: true
        default: "10"

concurrency:
  group: turn14-chemical-guys-live-map
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURN14_CLIENT_ID: ${{ secrets.TURN14_CLIENT_ID }}
      TURN14_CLIENT_SECRET: ${{ secrets.TURN14_CLIENT_SECRET }}
      TURN14_BASE_URL: https://api.turn14.com
      WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
      TARGET_SITE: ${{ github.event_name == 'workflow_dispatch' && inputs.site || 'all' }}
      MAX_UPDATES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_updates || '10' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required secrets
        shell: bash
        run: |
          missing=0
          for name in TURN14_CLIENT_ID TURN14_CLIENT_SECRET WIX_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate integration
        run: npm run validate

      - name: Apply Chemical Guys MAP increases
        run: >-
          node src/cli.js
          --brand "Chemical Guys"
          --site "$TARGET_SITE"
          --apply
          --mode raise-only
          --max-updates "$MAX_UPDATES"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turn14-chemical-guys-live-map-report-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
