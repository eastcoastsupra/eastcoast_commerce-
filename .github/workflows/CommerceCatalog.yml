name: Supra and BMW Catalog and Price Check

on:
  push:
    branches:
      - commerce-expansion-20261103
    paths:
      - .github/workflows/CommerceCatalog.yml
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read

concurrency:
  group: eastcoast-commerce-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - name: Check all supplier prices and prepare verified catalog imports
        env:
          TURN14_CLIENT_ID: ${{ secrets.TURN14_CLIENT_ID }}
          TURN14_CLIENT_SECRET: ${{ secrets.TURN14_CLIENT_SECRET }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: node scripts/SyncCommerce.mjs --apply --max-updates 1500 --max-creates 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commerce-summary-${{ github.run_id }}
          path: reports/commerce/Summary.json
          retention-days: 30
          if-no-files-found: warn
