name: Read Only Import Media Validation

on:
  push:
    branches:
      - shipping-pounds-20261103
    paths:
      - .github/workflows/ImportMediaCheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - name: Inspect image validation counts without exporting supplier records
        env:
          TURN14_CLIENT_ID: ${{ secrets.TURN14_CLIENT_ID }}
          TURN14_CLIENT_SECRET: ${{ secrets.TURN14_CLIENT_SECRET }}
        run: node scripts/InspectImportMedia.mjs
