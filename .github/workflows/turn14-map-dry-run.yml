name: Turn 14 Catalog Preview

on:
  workflow_dispatch:
    inputs:
      brand:
        description: Exact supplier brand names, comma-separated; blank scans all brands
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - name: Preview both stores with aggregate reporting
        env:
          TURN14_CLIENT_ID: ${{ secrets.TURN14_CLIENT_ID }}
          TURN14_CLIENT_SECRET: ${{ secrets.TURN14_CLIENT_SECRET }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          TARGET_BRANDS: ${{ inputs.brand }}
        run: |
          if [ -n "$TARGET_BRANDS" ]; then
            node scripts/SyncCommerce.mjs --brands "$TARGET_BRANDS"
          else
            node scripts/SyncCommerce.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commerce-preview-${{ github.run_id }}
          path: reports/commerce/Summary.json
          retention-days: 14
          if-no-files-found: warn
